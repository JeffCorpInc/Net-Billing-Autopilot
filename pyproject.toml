[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbilling-assistant"
version = "0.1.0"
description = "Net-Billing Application Assistant for K-Electric Prosumer Applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "rapidfuzz>=3.9.0",
    "openai>=1.35.0",
    "reportlab>=4.2.0",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

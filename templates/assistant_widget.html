<!-- AI Onboarding Copilot (Chatbot Assistant) - Only on New/Edit Application & Custom User Cases -->
<div id="ai-assistant-root"
     data-case-id="{{ case_id if case_id is defined else next_case_id }}"
     data-context-mode="{{ 'form' if active_page == 'new_case' else 'case_view' }}"
     class="fixed bottom-6 right-7 z-40">

  <!-- Expandable Chat Panel (Anchored directly ABOVE the 56px circular bot icon: bottom-16 = 64px) -->
  <div id="ai-assistant-panel"
       style="display: none;"
       class="absolute bottom-16 right-0 w-[350px] sm:w-[400px] max-h-[72vh] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl flex-col overflow-hidden">

    <!-- Panel Header -->
    <div class="bg-gradient-to-r from-[#0F172A] via-slate-900 to-slate-800 text-white px-4 py-3.5 flex items-center justify-between border-b border-slate-800">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center font-bold shadow">
          <i data-lucide="bot" class="w-4 h-4"></i>
        </div>
        <div>
          <div class="text-xs font-extrabold tracking-tight flex items-center gap-1.5">
            <span>NetBill AI Copilot</span>
            <span class="px-1.5 py-0.5 rounded-full text-[9px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">PII Redacted</span>
          </div>
          <div class="text-[10px] text-slate-400">Live Form &amp; Compliance Assistant</div>
        </div>
      </div>

      <div class="flex items-center gap-1">
        <button id="ai-assistant-scan-btn" type="button"
                onclick="if(window.AssistantCopilot) window.AssistantCopilot.sendPrompt('Check my current entries and tell me what is wrong or mismatched.');"
                title="Scan current entries now"
                class="px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 text-[10px] font-bold transition-colors flex items-center gap-1 cursor-pointer">
          <i data-lucide="scan-search" class="w-3 h-3"></i>
          <span>Check Now</span>
        </button>
        <button id="ai-assistant-close-btn" type="button"
                onclick="if(window.AssistantCopilot) window.AssistantCopilot.closePanel(); else document.getElementById('ai-assistant-panel').style.display='none';"
                aria-label="Close AI Assistant"
                class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Quick Prompt Chips -->
    <div class="px-3 py-2 bg-slate-50 dark:bg-slate-850 border-b border-slate-200 dark:border-slate-800 flex items-center gap-1.5 overflow-x-auto no-scrollbar text-[11px]">
      <button type="button"
              data-ai-prompt="What did I enter wrong or leave incomplete?"
              onclick="if(window.AssistantCopilot) window.AssistantCopilot.sendPrompt(this.getAttribute('data-ai-prompt'));"
              class="shrink-0 px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 font-semibold transition-colors cursor-pointer">
        What did I do wrong?
      </button>
      <button type="button"
              data-ai-prompt="Check for name and address mismatches across my documents."
              onclick="if(window.AssistantCopilot) window.AssistantCopilot.sendPrompt(this.getAttribute('data-ai-prompt'));"
              class="shrink-0 px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 font-semibold transition-colors cursor-pointer">
        Check mismatches
      </button>
      <button type="button"
              data-ai-prompt="Which required documents am I still missing?"
              onclick="if(window.AssistantCopilot) window.AssistantCopilot.sendPrompt(this.getAttribute('data-ai-prompt'));"
              class="shrink-0 px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 font-semibold transition-colors cursor-pointer">
        Missing docs?
      </button>
    </div>

    <!-- Messages Container -->
    <div id="ai-assistant-messages" class="flex-1 p-3.5 space-y-3 overflow-y-auto max-h-[340px] text-xs bg-white dark:bg-slate-900">
      <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800/90 text-slate-700 dark:text-slate-200 leading-relaxed">
        👋 Hi! I'm your <strong>NetBill AI Copilot</strong>. Click <strong>"Check Now"</strong> or ask me anything—I'll flag wrong steps, capacity violations, expired CNICs, or name/address mismatches and highlight the exact field to fix.
      </div>
    </div>

    <!-- Input Bar (div instead of form so browser NEVER triggers a page reload) -->
    <div id="ai-assistant-form" class="p-2.5 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-850 flex items-center gap-2">
      <input id="ai-assistant-input" type="text"
             onkeydown="if(event.key==='Enter'){event.preventDefault();if(window.AssistantCopilot)window.AssistantCopilot.submitInput();}"
             placeholder="Ask why a check failed or how to fix it…"
             class="flex-1 px-3 py-2 text-xs rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
      <button id="ai-assistant-send-btn" type="button"
              onclick="if(window.AssistantCopilot) window.AssistantCopilot.submitInput();"
              class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition-all flex items-center gap-1 shrink-0 shadow cursor-pointer">
        <i data-lucide="send" class="w-3.5 h-3.5 pointer-events-none"></i>
      </button>
    </div>
  </div>

  <!-- Circular Floating Bot Icon (Bottom-Right Corner with Scrollbar Clearance) -->
  <button id="ai-assistant-toggle-btn" type="button"
          onclick="if(window.AssistantCopilot){window.AssistantCopilot.togglePanel();}else{var p=document.getElementById('ai-assistant-panel');if(p)p.style.display=(p.style.display==='none'||!p.style.display)?'flex':'none';}"
          title="AI Onboarding Copilot — Click to inspect errors & mismatches"
          aria-label="Open AI Onboarding Copilot"
          class="group relative w-14 h-14 rounded-full bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 hover:from-amber-300 hover:to-amber-500 text-slate-950 shadow-2xl ring-4 ring-amber-500/25 border-2 border-white dark:border-slate-800 flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer">
    <i data-lucide="bot" class="w-7 h-7 stroke-[2.2] pointer-events-none"></i>

    <!-- Top-Right Notification Badge for Detected Issues -->
    <span id="ai-assistant-badge"
          class="hidden pointer-events-none absolute -top-1.5 -right-1.5 min-w-[22px] h-[22px] px-1 rounded-full text-[10px] font-extrabold bg-rose-600 text-white border-2 border-white dark:border-slate-900 flex items-center justify-center shadow-md">
      0
    </span>

    <!-- Hover Tooltip Pill (Left of Circle) -->
    <span class="pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-150 absolute right-16 whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-900 text-white text-[11px] font-bold shadow-lg border border-slate-700">
      AI Copilot
    </span>
  </button>

</div>

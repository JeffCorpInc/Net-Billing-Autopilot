<!-- AI Onboarding Copilot (Chatbot Assistant) - Only on New/Edit Application & Custom User Cases -->
<div id="ai-assistant-root"
     data-case-id="{{ case_id if case_id is defined else next_case_id }}"
     data-context-mode="{{ 'form' if active_page == 'new_case' else 'case_view' }}"
     class="fixed bottom-6 right-7 z-40">

  <!-- Expandable Chat Panel (Anchored directly ABOVE the 56px circular bot icon: bottom-16 = 64px) -->
  <div id="ai-assistant-panel"
       style="display: none;"
       class="absolute bottom-16 right-0 w-[350px] sm:w-[400px] max-h-[72vh] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl flex-col overflow-hidden">

    <!-- Panel Header -->
    <div class="bg-gradient-to-r from-[#0F172A] via-slate-900 to-slate-800 text-white px-4 py-3.5 flex items-center justify-between border-b border-slate-800">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center font-bold shadow">
          <i data-lucide="bot" class="w-4 h-4"></i>
        </div>
        <div>
          <div class="text-xs font-extrabold tracking-tight flex items-center gap-1.5">
            <span>NetBill AI Copilot</span>
            <span class="px-1.5 py-0.5 rounded-full text-[9px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">PII Redacted</span>
          </div>
          <div class="text-[10px] text-slate-400">Live Form &amp; Compliance Assistant</div>
        </div>
      </div>

      <div class="flex items-center gap-1">
        <button id="ai-assistant-scan-btn" type="button"
                onclick="window.AssistantCopilot.sendPrompt('Check my current entries and tell me what is wrong or mismatched.');"
                title="Scan current entries now"
                class="px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 text-[10px] font-bold transition-colors flex items-center gap-1 cursor-pointer">
          <i data-lucide="scan-search" class="w-3 h-3 pointer-events-none"></i>
          <span>Check Now</span>
        </button>
        <button id="ai-assistant-close-btn" type="button"
                onclick="window.AssistantCopilot.closePanel();"
                aria-label="Close AI Assistant"
                class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer">
          <i data-lucide="x" class="w-4 h-4 pointer-events-none"></i>
        </button>
      </div>
    </div>

    <!-- Quick Prompt Chips -->
    <div class="px-3 py-2 bg-slate-50 dark:bg-slate-850 border-b border-slate-200 dark:border-slate-800 flex items-center gap-1.5 overflow-x-auto no-scrollbar text-[11px]">
      <button type="button"
              data-ai-prompt="What did I enter wrong or leave incomplete?"
              onclick="window.AssistantCopilot.sendPrompt(this.getAttribute('data-ai-prompt'));"
              class="shrink-0 px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 font-semibold transition-colors cursor-pointer">
        What did I do wrong?
      </button>
      <button type="button"
              data-ai-prompt="Check for name and address mismatches across my documents."
              onclick="window.AssistantCopilot.sendPrompt(this.getAttribute('data-ai-prompt'));"
              class="shrink-0 px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 font-semibold transition-colors cursor-pointer">
        Check mismatches
      </button>
      <button type="button"
              data-ai-prompt="Which required documents am I still missing?"
              onclick="window.AssistantCopilot.sendPrompt(this.getAttribute('data-ai-prompt'));"
              class="shrink-0 px-2.5 py-1 rounded-full bg-white dark:bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 font-semibold transition-colors cursor-pointer">
        Missing docs?
      </button>
    </div>

    <!-- Messages Container -->
    <div id="ai-assistant-messages" class="flex-1 p-3.5 space-y-3 overflow-y-auto max-h-[340px] text-xs bg-white dark:bg-slate-900">
      <div class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800/90 text-slate-700 dark:text-slate-200 leading-relaxed">
        👋 Hi! I'm your <strong>NetBill AI Copilot</strong>. Click <strong>"Check Now"</strong> or ask me anything—I'll flag wrong steps, capacity violations, expired CNICs, or name/address mismatches and highlight the exact field to fix.
      </div>
    </div>

    <!-- Input Bar (div instead of form so browser NEVER triggers a page reload) -->
    <div id="ai-assistant-form" class="p-2.5 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-850 flex items-center gap-2">
      <input id="ai-assistant-input" type="text"
             onkeydown="if(event.key==='Enter'){event.preventDefault();window.AssistantCopilot.submitInput();}"
             placeholder="Ask why a check failed or how to fix it…"
             class="flex-1 px-3 py-2 text-xs rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
      <button id="ai-assistant-send-btn" type="button"
              onclick="window.AssistantCopilot.submitInput();"
              class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition-all flex items-center gap-1 shrink-0 shadow cursor-pointer">
        <i data-lucide="send" class="w-3.5 h-3.5 pointer-events-none"></i>
      </button>
    </div>
  </div>

  <!-- Circular Floating Bot Icon (Bottom-Right Corner with Scrollbar Clearance) -->
  <button id="ai-assistant-toggle-btn" type="button"
          onclick="window.AssistantCopilot.togglePanel();"
          title="AI Onboarding Copilot — Click to inspect errors & mismatches"
          aria-label="Open AI Onboarding Copilot"
          class="group relative w-14 h-14 rounded-full bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 hover:from-amber-300 hover:to-amber-500 text-slate-950 shadow-2xl ring-4 ring-amber-500/25 border-2 border-white dark:border-slate-800 flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer">
    <i data-lucide="bot" class="w-7 h-7 stroke-[2.2] pointer-events-none"></i>

    <!-- Top-Right Notification Badge for Detected Issues -->
    <span id="ai-assistant-badge"
          class="hidden pointer-events-none absolute -top-1.5 -right-1.5 min-w-[22px] h-[22px] px-1 rounded-full text-[10px] font-extrabold bg-rose-600 text-white border-2 border-white dark:border-slate-900 flex items-center justify-center shadow-md">
      0
    </span>

    <!-- Hover Tooltip Pill (Left of Circle) -->
    <span class="pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-150 absolute right-16 whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-900 text-white text-[11px] font-bold shadow-lg border border-slate-700">
      AI Copilot
    </span>
  </button>

</div>

<!-- Self-Contained AI Copilot Engine (Inline so it NEVER fails due to external JS caching) -->
<script>
(function () {
  'use strict';

  const AssistantCopilot = {
    caseId: 'DRAFT',
    contextMode: 'form',
    isOpen: false,
    isBusy: false,

    syncContext() {
      const root = document.getElementById('ai-assistant-root');
      if (!root) return;
      this.caseId = root.getAttribute('data-case-id') || 'DRAFT';
      this.contextMode = root.getAttribute('data-context-mode') || 'form';
    },

    init() {
      const root = document.getElementById('ai-assistant-root');
      if (!root || root.getAttribute('data-initialized') === 'true') return;
      root.setAttribute('data-initialized', 'true');
      this.syncContext();

      if (this.contextMode === 'form') {
        const appForm = document.getElementById('new-case-form');
        if (appForm) {
          let debounceTimer = null;
          appForm.addEventListener('change', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => this.silentBackgroundCheck(), 600);
          });
        }
        ['fill-clean-btn', 'fill-trap-btn'].forEach(btnId => {
          const b = document.getElementById(btnId);
          if (b) {
            b.addEventListener('click', () => {
              setTimeout(() => {
                this.openPanel();
                this.sendPrompt('Analyze the fields I just entered and tell me if there are any wrong entries or mismatches.');
              }, 250);
            });
          }
        });
      } else {
        setTimeout(() => this.silentBackgroundCheck(), 400);
      }
    },

    togglePanel() {
      const panel = document.getElementById('ai-assistant-panel');
      if (!panel) return;
      if (panel.style.display === 'none' || !panel.style.display) {
        this.openPanel();
      } else {
        this.closePanel();
      }
    },

    openPanel() {
      const panel = document.getElementById('ai-assistant-panel');
      if (!panel) return;
      panel.style.display = 'flex';
      this.isOpen = true;
      if (window.lucide) window.lucide.createIcons({ root: panel });
    },

    closePanel() {
      const panel = document.getElementById('ai-assistant-panel');
      if (!panel) return;
      panel.style.display = 'none';
      this.isOpen = false;
    },

    submitInput() {
      const input = document.getElementById('ai-assistant-input');
      const msg = input ? input.value.trim() : '';
      if (!msg) return;
      input.value = '';
      this.sendPrompt(msg);
    },

    collectLiveDraftState() {
      this.syncContext();
      if (this.contextMode !== 'form') {
        return null;
      }

      const docsPresent = Array.from(document.querySelectorAll('.doc-checkbox:checked')).map(cb => cb.value);

      return {
        description: document.getElementById('f-description')?.value.trim() || '',
        applicant_type: document.getElementById('f-applicant-type')?.value || 'residential',
        is_tenant: Boolean(document.getElementById('f-is-tenant')?.checked),
        docs_present: docsPresent,
        cnic: {
          name: document.getElementById('f-cnic-name')?.value.trim() || '',
          father_name: document.getElementById('f-cnic-father')?.value.trim() || '',
          cnic_no: document.getElementById('f-cnic-no')?.value.trim() || '',
          expiry: document.getElementById('f-cnic-expiry')?.value.trim() || '',
          address: document.getElementById('f-cnic-address')?.value.trim() || '',
        },
        bill: {
          consumer_name: document.getElementById('f-bill-name')?.value.trim() || '',
          reference_no: document.getElementById('f-bill-ref')?.value.trim() || '',
          sanctioned_load_kw: document.getElementById('f-sanctioned-kw')?.value || '',
          connected_load_kw: document.getElementById('f-connected-kw')?.value || '',
          tariff: document.getElementById('f-bill-tariff')?.value || 'A-1',
          connection_phase: document.getElementById('f-phase')?.value || '3-phase',
          address: document.getElementById('f-bill-address')?.value.trim() || '',
        },
        ownership: {
          type: document.getElementById('f-ownership-type')?.value || 'sale_deed',
          owner_name: document.getElementById('f-owner-name')?.value.trim() || '',
          property_address: document.getElementById('f-property-address')?.value.trim() || '',
        },
        system: {
          proposed_kw: document.getElementById('f-proposed-kw')?.value || '',
          inverter_kw: document.getElementById('f-inverter-kw')?.value || '',
          panel_count: document.getElementById('f-panel-count')?.value || '',
          panel_watt: document.getElementById('f-panel-watt')?.value || '',
        },
      };
    },

    async silentBackgroundCheck() {
      this.syncContext();
      try {
        const res = await fetch('/api/assistant/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            case_id: this.caseId,
            message: 'Quick status check',
            draft_state: this.collectLiveDraftState(),
            inspect_only: true,
          }),
        });
        if (!res.ok) return;
        const data = await res.json();
        this.updateIssueBadge(data.issues?.length || 0);
        this.highlightFormFields(data.issues || []);
      } catch (e) {}
    },

    updateIssueBadge(issueCount) {
      const badge = document.getElementById('ai-assistant-badge');
      if (!badge) return;
      if (issueCount > 0) {
        badge.textContent = String(issueCount);
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    },

    highlightFormFields(issues) {
      this.syncContext();
      if (this.contextMode !== 'form') return;

      document.querySelectorAll('.ai-field-error').forEach(el => {
        el.classList.remove('ai-field-error', 'ring-2', 'ring-rose-500', 'border-rose-500');
      });

      issues.forEach(iss => {
        if (!iss.field_id) return;
        const fieldEl = document.getElementById(iss.field_id);
        if (fieldEl) {
          fieldEl.classList.add('ai-field-error', 'ring-2', 'ring-rose-500', 'border-rose-500');
        }
      });
    },

    focusField(fieldId) {
      this.syncContext();
      if (this.contextMode !== 'form') {
        window.location.href = `/case/${this.caseId}/edit#${fieldId}`;
        return;
      }
      const el = document.getElementById(fieldId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.focus();
        el.classList.add('ring-2', 'ring-amber-500');
        setTimeout(() => el.classList.remove('ring-amber-500'), 2000);
      }
    },

    formatMarkdown(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
    },

    appendMessage(role, htmlContent) {
      const box = document.getElementById('ai-assistant-messages');
      if (!box) return null;

      const msgEl = document.createElement('div');
      if (role === 'user') {
        msgEl.className = 'ml-8 p-2.5 rounded-2xl bg-amber-500 text-slate-950 font-semibold leading-snug shadow-sm';
      } else {
        msgEl.className = 'mr-4 p-3 rounded-2xl bg-slate-100 dark:bg-slate-800/90 text-slate-800 dark:text-slate-100 leading-relaxed border border-slate-200/70 dark:border-slate-700/70 space-y-2';
      }
      msgEl.innerHTML = htmlContent;
      box.appendChild(msgEl);
      box.scrollTop = box.scrollHeight;
      if (window.lucide) window.lucide.createIcons({ root: msgEl });
      return msgEl;
    },

    async sendPrompt(userText) {
      if (!userText || this.isBusy) return;
      this.syncContext();
      this.openPanel();
      this.isBusy = true;

      this.appendMessage('user', this.formatMarkdown(userText));
      const loadingEl = this.appendMessage(
        'assistant',
        `<div class="flex items-center gap-2 text-slate-400">
           <span class="w-3.5 h-3.5 border-2 border-amber-500 border-t-transparent rounded-full animate-spin"></span>
           <span>Checking rules &amp; consulting AI Copilot…</span>
         </div>`
      );

      try {
        const res = await fetch('/api/assistant/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            case_id: this.caseId,
            message: userText,
            draft_state: this.collectLiveDraftState(),
          }),
        });

        const data = await res.json();
        if (loadingEl) loadingEl.remove();

        if (!res.ok) {
          throw new Error(data.detail || 'Assistant request failed');
        }

        const issues = data.issues || [];
        this.updateIssueBadge(issues.length);
        this.highlightFormFields(issues);

        let issueChipsHtml = '';
        if (issues.length > 0) {
          issueChipsHtml = `
            <div class="pt-2 border-t border-slate-200 dark:border-slate-700 space-y-1.5">
              <div class="text-[10px] font-bold uppercase tracking-wider text-rose-600 dark:text-rose-400">
                Click to jump &amp; fix (${issues.length}):
              </div>
              <div class="flex flex-wrap gap-1.5">
                ${issues.map(iss => `
                  <button type="button" data-jump-field="${iss.field_id || ''}"
                          class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 inline-flex items-center gap-1 transition-colors cursor-pointer">
                    <span>[${iss.rule_id}] ${iss.title}</span>
                    <i data-lucide="arrow-up-right" class="w-3 h-3 pointer-events-none"></i>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }

        const metaFooter = `
          <div class="pt-1 flex items-center justify-between text-[10px] text-slate-400 font-mono">
            <span>Engine: ${data.source || 'llm'} (${data.model || 'gemini'})</span>
            <span>${data.latency_ms ?? 0} ms</span>
          </div>
        `;

        const msgNode = this.appendMessage(
          'assistant',
          `<div>${this.formatMarkdown(data.reply)}</div>${issueChipsHtml}${metaFooter}`
        );

        if (msgNode) {
          msgNode.querySelectorAll('[data-jump-field]').forEach(btn => {
            btn.addEventListener('click', () => {
              const fid = btn.getAttribute('data-jump-field');
              if (fid) this.focusField(fid);
            });
          });
        }

      } catch (err) {
        if (loadingEl) loadingEl.remove();
        this.appendMessage(
          'assistant',
          `<span class="text-rose-500 font-semibold">Error: ${this.formatMarkdown(err.message)}</span>`
        );
      } finally {
        this.isBusy = false;
      }
    }
  };

  window.AssistantCopilot = AssistantCopilot;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => AssistantCopilot.init());
  } else {
    AssistantCopilot.init();
  }
})();
</script>
